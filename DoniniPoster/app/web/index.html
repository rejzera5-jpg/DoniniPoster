<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donini Poster</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<aside>
  <div class="brand"><img src="/icon.png" alt=""><div><b>Donini Poster</b><span id="ver">…</span></div></div>
  <div class="search"><input id="gSearch" placeholder="Код или название  Ctrl+K"></div>
  <button class="nav" data-page="home"><span class="ic">🏠</span><span>Сводка</span></button>
  <div class="cap">Очереди</div>
  <div id="qMain"></div>
  <button class="nav" id="moreBtn"><span class="ic" id="moreArrow">▸</span><span id="moreLbl">Ещё</span></button>
  <div class="more" id="qMore"></div>
  <button class="nav" id="newQBtn"><span class="ic">＋</span><span>Новая очередь</span></button>
  <div class="cap">Работа</div>
  <button class="nav" data-page="add"><span class="ic">📥</span><span>Добавить товары</span></button>
  <button class="nav" data-page="tpl"><span class="ic">🧾</span><span>Шаблоны Donini</span></button>
  <button class="nav" data-page="sites"><span class="ic">🧩</span><span>Сайты и сценарии</span><span class="n err hidden" id="nNoSc" title="сайты без записи"></span></button>
  <button class="nav" data-page="edits"><span class="ic">✏️</span><span>Исправить объявления</span><span class="n hidden" id="nEdits"></span></button>
  <button class="nav" data-page="insta"><span class="ic">📸</span><span>Instagram</span><span class="n">скоро</span></button>
  <div class="cap">Программа</div>
  <button class="nav" data-page="log"><span class="ic">📜</span><span>Журнал</span><span class="n err hidden" id="nErr"></span></button>
  <button class="nav" data-page="settings"><span class="ic">⚙️</span><span>Настройки</span></button>
  <div class="side-foot">
    <div id="extState">Расширение: …</div>
    <div id="tgState"></div>
    <div>Последний код: <b class="code" id="counter">—</b></div>
  </div>
</aside>

<div class="wrap"><main>
<div id="banners" class="page" style="margin-bottom:14px"></div>
<section class="page hidden" id="page-home"></section>
<section class="page hidden" id="page-queue"></section>
<section class="page hidden" id="page-sites"></section>
<section class="page hidden" id="page-tpl"></section>
<section class="page hidden" id="page-insta"></section>
<section class="page hidden" id="page-add"></section>
<section class="page hidden" id="page-edits"></section>
<section class="page hidden" id="page-log">
  <div class="row"><h1>Журнал</h1><span class="spacer"></span>
    <input id="logQ" placeholder="Поиск: код товара, сайт…" style="width:280px">
    <label class="check small"><input type="checkbox" id="logErr"> только ошибки</label></div>
  <div class="card"><div class="loglist" id="logList"></div></div>
</section>
<section class="page hidden" id="page-settings"></section>
</main></div>

<input type="file" id="dirPick" webkitdirectory multiple class="hidden">
<script src="/ui/core.js"></script>
<script src="/ui/queue.js"></script>
<script src="/ui/add.js"></script>
<script src="/ui/settings.js"></script>
<script src="/ui/sites.js"></script>
<script src="/ui/templates.js"></script>
<script src="/ui/home.js"></script>
<script src="/ui/edits.js"></script>
<script>boot();</script>
</body>
</html>
